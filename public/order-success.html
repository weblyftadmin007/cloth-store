<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order confirmed - Your Brand</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%231d1c1a'/%3E%3Cpath d='M50 22a10 10 0 0 1 3.8 19.2L82 62v8H18v-8l28.2-20.8A10 10 0 0 1 50 22Z' fill='none' stroke='%23fdfcfa' stroke-width='5'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="announce" data-role="announcement"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" data-role="brand">Your Brand</a>
      <nav class="nav"><a href="/">Home</a> <a href="/shop">Shop</a></nav>
      <div class="header-actions">
        <a class="cart-btn" href="/cart">Cart <span class="cart-badge is-empty" id="cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="empty-state">
      <div style="font-size:3rem">✓</div>
      <h1 class="page-title" style="margin:10px 0 4px">Order confirmed</h1>
      <p style="color:var(--muted);max-width:46ch;margin:0 auto 8px">
        Thanks! Your payment went through and we have received your order.
      </p>
      <p style="color:var(--muted);max-width:46ch;margin:0 auto 26px">
        Order ID: <strong id="order-id">—</strong>. We will email / SMS you once it ships.
      </p>
      <div class="btn-row" style="justify-content:center">
        <a class="btn btn-dark" href="/shop">Continue shopping</a>
        <a class="btn btn-outline" href="/">Back to home</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span data-role="footer-text"></span>
      <a data-role="support-phone" href="#"></a>
    </div>
  </footer>

  <script src="/js/store.js"></script>
  <script>App.initChrome().catch(()=>{}); document.getElementById('order-id').textContent = new URLSearchParams(location.search).get('order_id') || '—';</script>
</body>
</html>
