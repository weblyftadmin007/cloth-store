<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home - Your Brand</title>
  <meta name="description" content="Shop the latest drop." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%231d1c1a'/%3E%3Cpath d='M50 22a10 10 0 0 1 3.8 19.2L82 62v8H18v-8l28.2-20.8A10 10 0 0 1 50 22Z' fill='none' stroke='%23fdfcfa' stroke-width='5'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="announce" data-role="announcement"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" data-role="brand">Your Brand</a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/shop">Shop</a>
        <a href="/shop?category=Tees">Tees</a>
        <a href="/shop?category=Hoodies">Hoodies</a>
        <a href="/shop?category=Jackets">Jackets</a>
      </nav>
      <div class="header-actions">
        <a class="cart-btn" href="/cart">Cart <span class="cart-badge is-empty" id="cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div>
          <h1 data-hero-title>Quietly exceptional essentials</h1>
          <p data-hero-sub>Considered wardrobe staples, crafted from natural fibres and made to be lived in.</p>
          <div class="btn-row">
            <a class="btn btn-dark" href="/shop">Shop the collection</a>
            <a class="btn btn-outline" href="#categories">Browse categories</a>
          </div>
        </div>
        <img class="hero-img" data-hero-image src="/assets/hero.svg" alt="Featured product" />
      </div>
    </section>

    <section class="section" id="featured">
      <div class="container">
        <div class="section-head">
          <div>
            <h2>Featured</h2>
            <p class="sub">Bestsellers from this season</p>
          </div>
          <a class="see-all" href="/shop">See all &rarr;</a>
        </div>
        <div class="grid" id="featured-grid"></div>
      </div>
    </section>

    <section class="section" id="categories" style="padding-top:0">
      <div class="container">
        <div class="section-head">
          <div>
            <h2>Shop by category</h2>
            <p class="sub">Pick your staple</p>
          </div>
        </div>
        <div class="grid cols-3" id="category-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span data-role="footer-text"></span>
      <a data-role="support-phone" href="#"></a>
    </div>
  </footer>

  <script src="/js/store.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
