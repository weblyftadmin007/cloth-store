<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop - Your Brand</title>
  <meta name="description" content="Browse our full catalog." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%231d1c1a'/%3E%3Cpath d='M50 22a10 10 0 0 1 3.8 19.2L82 62v8H18v-8l28.2-20.8A10 10 0 0 1 50 22Z' fill='none' stroke='%23fdfcfa' stroke-width='5'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="announce" data-role="announcement"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" data-role="brand">Your Brand</a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/shop">Shop</a>
        <a href="/cart">Cart</a>
      </nav>
      <div class="header-actions">
        <a class="cart-btn" href="/cart">Cart <span class="cart-badge is-empty" id="cart-badge">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Shop</h1>
    <p class="page-sub" id="result-count"></p>

    <div class="shop-toolbar">
      <div class="chips" id="category-chips"></div>
      <button class="chip" data-chip="" id="all-chip">All</button>
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="search-input" type="search" placeholder="Search products..." />
      </div>
      <select class="control" id="sort-select">
        <option value="default">Sort: Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name">Name A-Z</option>
      </select>
    </div>

    <div class="grid" id="shop-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <h3>No products found</h3>
      <p>Try a different search or category.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span data-role="footer-text"></span>
      <a data-role="support-phone" href="#"></a>
    </div>
  </footer>

  <script src="/js/store.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
